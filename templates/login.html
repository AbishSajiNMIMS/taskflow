<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | TaskFlow</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; }
        main { width: min(100% - 2rem, 26rem); padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 12px 40px #17203318; }
        h1 { margin-top: 0; }
        label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
        input { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #c8d0dc; border-radius: .45rem; }
        button { width: 100%; margin-top: 1.25rem; padding: .75rem; border: 0; border-radius: .45rem; color: white; background: #2563eb; font-weight: 700; cursor: pointer; }
        .errorlist { padding: .75rem; color: #9f1239; background: #fff1f2; border-radius: .45rem; }
    </style>
</head>
<body>
<main>
    <h1>TaskFlow</h1>
    <p>Sign in to manage your tasks.</p>
    {% if form.errors %}<p class="errorlist">Your username or password was not recognised.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Username</label>
        {{ form.username }}
        <label for="id_password">Password</label>
        {{ form.password }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
